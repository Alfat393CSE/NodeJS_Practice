<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>404 Error</title>
    <link href="/output.css" rel="stylesheet" />
  </head>
  <body class="min-h-screen bg-slate-950 text-white">
    <main
      class="relative flex min-h-screen items-center justify-center overflow-hidden px-6"
    >
      <!-- Background Glow -->
      <div
        class="absolute -left-24 -top-24 h-80 w-80 rounded-full bg-blue-600/20 blur-3xl"
      ></div>
      <div
        class="absolute -bottom-24 -right-24 h-80 w-80 rounded-full bg-purple-600/20 blur-3xl"
      ></div>
      <!-- Decorative Circle -->
      <div
        class="absolute left-1/4 top-1/4 h-3 w-3 rounded-full bg-blue-400/60"
      ></div>
      <div
        class="absolute bottom-1/4 right-1/4 h-2 w-2 rounded-full bg-purple-400/60"
      ></div>
      <!-- Main Card -->
      <section
        class="relative z-10 w-full max-w-lg rounded-3xl border border-white/10 bg-white/5 p-8 text-center shadow-2xl backdrop-blur-xl sm:p-12"
      >
        <!-- Icon -->
        <div
          class="mx-auto mb-6 flex h-20 w-20 items-center justify-center rounded-2xl border border-blue-400/20 bg-blue-500/10 text-4xl"
        >
          🔍
        </div>
        <!-- 404 -->
        <h1
          class="bg-linear-to-r from-blue-400 via-cyan-400 to-purple-500 bg-clip-text text-8xl font-black tracking-tight text-transparent sm:text-9xl"
        >
          404
        </h1>
        <!-- Heading -->
        <h2
          class="mt-5 text-2xl font-bold tracking-tight text-white sm:text-3xl"
        >
          Page Not Found
        </h2>
        <!-- Description -->
        <p
          class="mx-auto mt-4 max-w-md text-sm leading-7 text-slate-400 sm:text-base"
        >
          Sorry, we couldn't find the page you're looking for. It may have been
          moved, deleted, or the URL might be incorrect.
        </p>
        <!-- Button -->
        <div class="mt-8">
          <a
            href="/"
            class="inline-flex items-center gap-2 rounded-xl bg-blue-600 px-6 py-3 font-semibold text-white shadow-lg shadow-blue-600/20 transition-all duration-300 hover:-translate-y-1 hover:bg-blue-500 hover:shadow-xl hover:shadow-blue-500/30 focus:outline-none focus:ring-2 focus:ring-blue-400 focus:ring-offset-2 focus:ring-offset-slate-950"
          >
            <span class="text-lg">←</span> Back to Home
          </a>
        </div>
        <!-- Error Code -->
        <p
          class="mt-8 text-xs font-medium uppercase tracking-widest text-slate-600"
        >
          Error Code • 404
        </p>
      </section>
    </main>
  </body>
</html>
