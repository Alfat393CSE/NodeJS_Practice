<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Input form</title>
    <link href="/output.css" rel="stylesheet" />
  </head>
  <body class="min-h-screen bg-slate-950 text-white">

<main
  class="relative flex min-h-screen items-center justify-center
         overflow-hidden px-6"
>

  <!-- Background Glow -->
  <div
    class="absolute -left-24 -top-24 h-80 w-80 rounded-full
           bg-blue-600/20 blur-3xl"
  ></div>

  <div
    class="absolute -bottom-24 -right-24 h-80 w-80 rounded-full
           bg-purple-600/20 blur-3xl"
  ></div>

  <!-- Form Card -->
  <section
    class="relative z-10 w-full max-w-lg rounded-3xl border
           border-white/10 bg-white/5 p-8 shadow-2xl
           backdrop-blur-xl sm:p-10"
  >

    <!-- Icon -->
    <div
      class="mx-auto mb-6 flex h-16 w-16 items-center justify-center
             rounded-2xl border border-blue-400/20
             bg-blue-500/10 text-3xl"
    >
      🏠
    </div>

    <!-- Heading -->
    <h1
      class="text-center bg-linear-to-r from-blue-400 via-cyan-400
             to-purple-500 bg-clip-text text-3xl font-black
             tracking-tight text-transparent sm:text-4xl"
    >
      Submit Your Details
    </h1>

    <p class="mt-3 text-center text-sm leading-6 text-slate-400">
      Add your house details to make it available on Airbnb.
    </p>

    <!-- Form -->
    <form
      action="/user/submit-detailes"
      method="POST"
      class="mt-8 space-y-6"
    >

      <!-- House Name -->
      <div>
        <label
          for="houseName"
          class="mb-2 block text-sm font-semibold text-slate-300"
        >
          House Name
        </label>

        <input
          id="houseName"
          type="text"
          name="houseName"
          placeholder="Enter your house name"
          required
          class="w-full rounded-xl border border-white/10
                 bg-slate-900/70 px-4 py-3 text-white
                 placeholder-slate-500 outline-none
                 transition-all duration-300
                 focus:border-blue-400
                 focus:ring-2 focus:ring-blue-400/20"
        />
      </div>

      <!-- Submit Button -->
      <button
        type="submit"
        class="w-full rounded-xl bg-blue-600 px-6 py-3
               font-semibold text-white shadow-lg
               shadow-blue-600/20 transition-all duration-300
               hover:-translate-y-1 hover:bg-blue-500
               hover:shadow-xl hover:shadow-blue-500/30
               focus:outline-none focus:ring-2
               focus:ring-blue-400 focus:ring-offset-2
               focus:ring-offset-slate-950"
      >
        Submit Details
        <span class="ml-1">→</span>
      </button>

    </form>

    <!-- Back Link -->
    <div class="mt-6 text-center">
      <a
        href="/"
        class="text-sm font-medium text-slate-500
               transition-colors hover:text-blue-400"
      >
        ← Back to Home
      </a>
    </div>

  </section>
</main>

</body>
</html>
